<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#146b3a"/>
      <stop offset="55%" stop-color="#0c5f2f"/>
      <stop offset="100%" stop-color="#063c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d98a"/>
      <stop offset="50%" stop-color="#d9b65c"/>
      <stop offset="100%" stop-color="#b8892f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="31" fill="url(#sheen)"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#d9b65c" stroke-width="0.6" opacity="0.5"/>

  <!-- Faux-3D F: dark offset shadow layer + gold face -->
  <text x="32.8" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700" fill="#04200f" opacity="0.55">F</text>
  <text x="32" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700" fill="url(#goldGrad)">F</text>
</svg>
