<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d98a"/>
      <stop offset="50%" stop-color="#d9b65c"/>
      <stop offset="100%" stop-color="#b8892f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#146b3a"/>
      <stop offset="100%" stop-color="#0c5f2f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer rosette star -->
  <polygon points="32.00,2.00 39.65,13.52 53.21,10.79 50.48,24.35 62.00,32.00 50.48,39.65 53.21,53.21 39.65,50.48 32.00,62.00 24.35,50.48 10.79,53.21 13.52,39.65 2.00,32.00 13.52,24.35 10.79,10.79 24.35,13.52"
    fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Middle accent star, rotated -->
  <polygon points="41.76,8.44 44.73,19.27 55.56,22.24 50.00,32.00 55.56,41.76 44.73,44.73 41.76,55.56 32.00,50.00 22.24,55.56 19.27,44.73 8.44,41.76 14.00,32.00 8.44,22.24 19.27,19.27 22.24,8.44 32.00,14.00"
    fill="none" stroke="url(#goldGrad)" stroke-width="0.9" opacity="0.85"/>

  <!-- Center medallion -->
  <circle cx="32" cy="32" r="15.5" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="15.5" fill="url(#sheen)"/>
  <circle cx="32" cy="32" r="12.3" fill="none" stroke="#d9b65c" stroke-width="0.5" opacity="0.55"/>

  <!-- Faux-3D F -->
  <text x="32.6" y="38.3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="700" fill="#04200f" opacity="0.55">F</text>
  <text x="32" y="37.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="700" fill="url(#goldGrad)">F</text>
